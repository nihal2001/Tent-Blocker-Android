plugins { id 'com.android.application' }
android {
    namespace 'com.nihal.tentblocker'
    compileSdk 35
    defaultConfig { applicationId 'com.nihal.tentblocker'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1'; testImplementation 'junit:junit:4.13.2' }
